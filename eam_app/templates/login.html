{% extends "base.html" %}

{% block title %}Login - EAM System{% endblock %}

{% block body_content %}
<div class="flex justify-center items-center min-h-screen bg-neutral-50 px-4">
    <div class="w-full max-w-[400px] bg-white rounded-2xl shadow-xl border border-neutral-100 p-6 sm:p-8">
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-primary rounded-xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4 shadow-md shadow-primary/20">
          <i class="ph-fill ph-hexagon"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-neutral-900 m-0 tracking-tight">Welcome Back</h2>
        <p class="text-neutral-500 mt-2 text-sm font-medium">Enter your credentials to access your account</p>
      </div>
      
      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 text-red-600{% else %}bg-green-50 text-green-600{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'portal_login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-bold text-neutral-700 mb-1.5">Username</label>
          <input
            type="text"
            name="username"
            required
            class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-medium"
          />
        </div>
        <div>
          <label class="block text-sm font-bold text-neutral-700 mb-1.5">Password</label>
          <div class="relative">
            <input
              type="password"
              name="password"
              id="password"
              required
              class="w-full px-4 py-2.5 pr-10 bg-neutral-50 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-medium"
            />
            <button
              type="button"
              onclick="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-600 focus:outline-none"
            >
              <i id="toggle-icon" class="ph ph-eye-slash"></i>
            </button>
          </div>
        </div>
        <button
          type="submit"
          class="w-full h-12 mt-4 bg-primary hover:bg-primary-600 text-white rounded-lg font-bold text-sm shadow-md shadow-primary/20 transition-all active:scale-[0.98]"
        >
          Sign In
        </button>
        <div class="text-center mt-4">
          <button
            type="button"
            onclick="document.getElementById('forgot-password-modal').classList.remove('hidden')"
            class="text-primary text-sm font-semibold hover:underline bg-transparent border-none cursor-pointer"
          >
            Forgot Password?
          </button>
        </div>
      </form>
    </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgot-password-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">
    <div class="px-6 py-4 border-b border-neutral-200 flex justify-between items-center bg-neutral-50">
      <h3 class="text-lg font-bold text-neutral-800 m-0">Reset Password</h3>
      <button onclick="closeForgotModal()" class="text-neutral-400 hover:text-neutral-600 transition-colors">
        <i class="ph ph-x text-xl"></i>
      </button>
    </div>
    
    <!-- Step 1: Request Code -->
    <form id="forgot-email-form" class="p-6 space-y-4">
      <div id="forgot-msg" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
      <div>
        <label class="block text-sm font-bold text-neutral-700 mb-1.5">Enter your registered email</label>
        <input type="email" id="forgotEmail" required placeholder="admin@example.com" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-medium" />
      </div>
      <div class="pt-2">
        <button type="submit" id="btn-forgot-email" class="w-full h-10 bg-primary hover:bg-primary-600 text-white text-sm font-bold rounded-lg transition-colors shadow-md shadow-primary/20">Send Reset Code</button>
      </div>
    </form>

    <!-- Step 2: Reset Password -->
    <form id="reset-password-form" class="hidden p-6 space-y-4">
      <div id="reset-msg" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
      <div>
        <label class="block text-sm font-bold text-neutral-700 mb-1.5">Enter 6-digit code from email (Demo: 123456)</label>
        <input type="text" id="resetCode" required class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-medium" />
      </div>
      <div>
        <label class="block text-sm font-bold text-neutral-700 mb-1.5">New Password</label>
        <input type="password" id="resetNewPassword" required minlength="6" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-200 rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-medium" />
      </div>
      <div class="pt-2">
        <button type="submit" id="btn-reset-pwd" class="w-full h-10 bg-primary hover:bg-primary-600 text-white text-sm font-bold rounded-lg transition-colors shadow-md shadow-primary/20">Reset Password</button>
      </div>
    </form>
  </div>
</div>

<script>
  function togglePassword() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('toggle-icon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.classList.replace('ph-eye-slash', 'ph-eye');
    } else {
      pwd.type = 'password';
      icon.classList.replace('ph-eye', 'ph-eye-slash');
    }
  }

  function closeForgotModal() {
      document.getElementById('forgot-password-modal').classList.add('hidden');
      document.getElementById('forgot-email-form').classList.remove('hidden');
      document.getElementById('reset-password-form').classList.add('hidden');
      document.getElementById('forgot-email-form').reset();
      document.getElementById('reset-password-form').reset();
      document.getElementById('forgot-msg').classList.add('hidden');
      document.getElementById('reset-msg').classList.add('hidden');
  }

  document.getElementById('forgot-email-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-forgot-email');
      const msg = document.getElementById('forgot-msg');
      btn.disabled = true;
      btn.innerText = 'Sending...';
      msg.classList.add('hidden');
      
      fetch('{% url "portal_forgot_password" %}', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify({ email: document.getElementById('forgotEmail').value })
      })
      .then(res => res.json())
      .then(data => {
          if(data.success) {
              msg.className = 'mb-4 p-3 rounded-lg text-sm bg-green-50 text-green-600 border border-green-200';
              msg.innerText = 'If the email exists, a reset code has been sent.';
              msg.classList.remove('hidden');
              setTimeout(() => {
                  document.getElementById('forgot-email-form').classList.add('hidden');
                  document.getElementById('reset-password-form').classList.remove('hidden');
              }, 1500);
          } else {
              msg.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-600 border border-red-200';
              msg.innerText = data.error || 'An error occurred';
              msg.classList.remove('hidden');
          }
      })
      .finally(() => {
          btn.disabled = false;
          btn.innerText = 'Send Reset Code';
      });
  });

  document.getElementById('reset-password-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-reset-pwd');
      const msg = document.getElementById('reset-msg');
      btn.disabled = true;
      btn.innerText = 'Resetting...';
      msg.classList.add('hidden');
      
      fetch('{% url "portal_reset_password" %}', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: JSON.stringify({ 
              code: document.getElementById('resetCode').value,
              newPassword: document.getElementById('resetNewPassword').value
          })
      })
      .then(res => res.json())
      .then(data => {
          if(data.success) {
              msg.className = 'mb-4 p-3 rounded-lg text-sm bg-green-50 text-green-600 border border-green-200';
              msg.innerText = 'Password reset successfully. You can now login.';
              msg.classList.remove('hidden');
              setTimeout(() => {
                  closeForgotModal();
              }, 2000);
          } else {
              msg.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-600 border border-red-200';
              msg.innerText = data.error || 'Failed to reset password';
              msg.classList.remove('hidden');
          }
      })
      .finally(() => {
          btn.disabled = false;
          btn.innerText = 'Reset Password';
      });
  });
</script>
{% endblock %}
