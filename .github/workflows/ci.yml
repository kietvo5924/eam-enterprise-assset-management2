name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "wip/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  django-backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eam_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django System Check
      env:
        SECRET_KEY: ci-test-secret-key-12345
        DEBUG: "True"
        DATABASE_URL: postgres://postgres:password@localhost:5432/eam_db
        POSTGRES_DB: eam_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DB_NAME: eam_db
        DB_USER: postgres
        DB_PASSWORD: password
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        python eam_app/manage.py check

    - name: Run Unit, Algorithm, Analytics & Core Tests
      env:
        SECRET_KEY: ci-test-secret-key-12345
        DEBUG: "True"
        DATABASE_URL: postgres://postgres:password@localhost:5432/eam_db
        POSTGRES_DB: eam_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DB_NAME: eam_db
        DB_USER: postgres
        DB_PASSWORD: password
        DB_HOST: localhost
        DB_PORT: 5432
      run: |
        python eam_app/manage.py test algorithms.tests analytics core notifications --noinput

  mobile-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - name: Install dependencies
      working-directory: ./mobile_app
      run: flutter pub get
    - name: Analyze
      working-directory: ./mobile_app
      run: flutter analyze
