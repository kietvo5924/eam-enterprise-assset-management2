name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Maven
      working-directory: ./backend
      run: ./mvnw clean verify

  web-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Install dependencies
      working-directory: ./web-portal
      run: npm install
    - name: Build
      working-directory: ./web-portal
      run: npm run build
    - name: Lint and Test (placeholder)
      working-directory: ./web-portal
      run: echo "Run tests and linting"

  mobile-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - name: Install dependencies
      working-directory: ./mobile_app
      run: flutter pub get
    - name: Analyze
      working-directory: ./mobile_app
      run: flutter analyze
    - name: Test
      working-directory: ./mobile_app
      run: flutter test
