spring.application.name=eam-api
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

resend.api-key=${RESEND_API_KEY:YOUR_RESEND_API_KEY}

minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:tenant-assets}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Increase multipart upload sizes for mobile photos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
